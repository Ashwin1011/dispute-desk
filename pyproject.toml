[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dispute-desk"
version = "0.1.0"
description = "A multi-agent payment-dispute/chargeback copilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sentence-transformers",
    "psycopg2-binary",
    "pgvector",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
py-modules = ["disputedesk"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
