[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dispute-desk"
version = "0.1.0"
description = "A multi-agent payment-dispute/chargeback copilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "fastapi",
    "langgraph",
    "pgvector",
    "psycopg2-binary",
    "pydantic",
    "python-dotenv",
    "sentence-transformers",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
disputedesk = "disputedesk:main"

[tool.setuptools]
py-modules = ["disputedesk", "anthropic_api_call"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
