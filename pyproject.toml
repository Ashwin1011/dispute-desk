[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dispute-desk"
version = "0.1.0"
description = "A multi-agent payment-dispute/chargeback copilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "fastapi",
    "langgraph",
    "mcp[cli]>=2.0.0",
    "pgvector",
    "psycopg2-binary",
    "pydantic",
    "python-dotenv",
    "sentence-transformers",
    "tavily-python>=0.7.27",
    "uvicorn",
    "weaviate-client>=4.23.0",
    "langfuse",
    "langchain>=1.3.18",
    "langchain"
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
disputedesk = "disputedesk:main"

[tool.setuptools]
py-modules = ["disputedesk", "anthropic_api_call", "mcp_server"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
